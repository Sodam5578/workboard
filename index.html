/* Worknote 02: larger, theme-aware surfaces and responsive layouts. */
:root{
 --surface:#ffffff;--surface-alt:#f7f8fb;--surface-side:#f4f6fa;--surface-hover:#ecf1f8;
 --surface-strong:#e7ecf4;--text:#202b3b;--sub:#54657c;--muted:#6c7c92;--line:#dfe5ee;
 --blue:#245fdf;--blue-soft:#edf3ff;--blue-ink:#285db3;--red:#be4353;--green:#247b61;
 --red-soft:#fff0f1;--green-soft:#edf7f2;--amber:#956519;--amber-soft:#fff7e5;
 --purple:#7955a5;--purple-soft:#f2edfa;--shadow:0 8px 30px #26374e0a;
 --check-border:#a4b2c5;--top-height:88px;--accent-border:#a9c0ee;
 font-size:16px;color-scheme:light;
}
:root[data-theme="dark"]{
 --surface:#161d28;--surface-alt:#1d2633;--surface-side:#111923;--surface-hover:#293548;
 --surface-strong:#303c4d;--text:#e7edf5;--sub:#b8c5d6;--muted:#96a6bc;--line:#324055;
 --blue:#4e85f5;--blue-soft:#243650;--blue-ink:#a7c6ff;--red:#ff9eab;--green:#87d2b5;
 --red-soft:#3c2731;--green-soft:#233c34;--amber:#f0c477;--amber-soft:#3c3424;
 --purple:#d0b2f5;--purple-soft:#322b45;--shadow:0 8px 30px #0003;
 --check-border:#788aa4;--accent-border:#527bbb;color-scheme:dark;
}
:root[data-size="large"]{font-size:17.5px}
:root[data-size="xlarge"]{font-size:19px}
html,body{height:100%;background:var(--surface);color:var(--text)}
body{font-size:1rem;line-height:1.6}
input,select,textarea{color:var(--text);background:var(--surface)}
::placeholder{color:var(--muted)!important;opacity:1}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
button:focus-visible,[role=button]:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.app{grid-template-columns:17.5rem minmax(0,1fr);height:100dvh;min-height:0}
.sidebar{background:var(--surface-side);padding:26px 18px 18px}
.brand h1{font-size:1.5rem}.brand small{font-size:.6875rem}
.brand{padding-bottom:24px}.brandmark{width:46px;height:46px}
.brandmark,.primary{background:#245fdf;color:#fff}.primary:hover{background:#194fca}
.workspace-label,.eyebrow,.section-caption,.brand-version,.panel-caption{color:var(--muted)}
.workspace-label{letter-spacing:.05em}
.smart{background:var(--surface-strong);min-height:94px;padding:14px}
.smart:hover{background:var(--surface-hover)}
.smart.active{background:#245fdf;color:#fff}
.navbtn{padding:12px 11px;font-size:1rem;min-height:46px;white-space:normal}
.navbtn>svg,.navcount{color:var(--muted)}
.navbtn:hover{background:var(--surface-hover)}
.navbtn.active{background:var(--blue-soft);color:var(--blue-ink)}
.navbtn.active>svg{color:var(--blue-ink)}
.storage-box{background:var(--surface);border-color:var(--line)}
.storage-title{font-size:.8125rem}
.storage-note,.bottom-actions button{color:var(--sub)}
.storage-note{font-size:.75rem}
.bottom-actions button{min-height:40px;font-size:.8125rem}
.brand-version{font-size:.6875rem}
.topbar{min-height:var(--top-height);height:auto;padding:14px 28px;gap:12px;background:var(--surface);flex-wrap:nowrap}
.topbar .mode-switch{flex-shrink:0}
.mode-switch{background:var(--surface-strong)}
.mode-switch button{color:var(--sub);min-height:40px;font-size:.9375rem}
.mode-switch button.active{background:var(--surface);color:var(--text)}
.top-search{flex:1;max-width:290px;min-width:120px;margin-left:auto;width:auto}
.top-search input{font-size:.875rem;min-height:44px;background:var(--surface-alt);border-color:var(--line);color:var(--text)}
.top-search svg{top:14px;color:var(--muted)}
.top-search kbd{top:12px;color:var(--muted);border-color:var(--line);font-size:.75rem}
.top-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.primary,.secondary{font-size:.9375rem;min-height:44px;padding:10px 15px}
.secondary{background:var(--surface);border-color:var(--line);color:var(--text)}
.secondary:hover,.ghost:hover,.iconbtn:hover{background:var(--surface-hover)}
.ghost{color:var(--sub);min-height:38px}
.iconbtn{width:40px;height:40px;color:var(--sub)}
.iconbtn:hover{color:var(--text)}
.icon{width:20px;height:20px}.icon-sm{width:18px;height:18px}
.theme-toggle{border:1px solid var(--line);border-radius:11px}
.size-shortcut{font-size:1rem;letter-spacing:-.08em}
.mini-launch{padding:10px 12px}
.body-grid{grid-template-columns:minmax(0,1fr) 22rem}
.center{padding:34px 32px 32px;overscroll-behavior:contain}
.right-panel{background:var(--surface-alt);padding:28px 23px;overscroll-behavior:contain}
.hero h2{font-size:2.125rem;letter-spacing:-.045em}
.hero p{font-size:.9375rem;color:var(--sub);max-width:52em}
.hero-icon{width:58px;height:58px;background:var(--amber-soft);color:var(--amber)}
.hero-icon.calendar-hero{background:var(--blue-soft);color:var(--blue-ink)}
.stat{background:var(--surface);border-color:var(--line);padding:18px}
.stat.first{background:var(--blue-soft);border-color:var(--line)}
.stat-head,.stat-num small{color:var(--sub)}
.stat-head{font-size:.875rem}
.stat-num strong{font-size:2rem}
.stat .microbar,.progress-track,.progress-large{background:var(--surface-strong)}
.demo-banner{font-size:.75rem;color:var(--muted);align-items:flex-start;flex-wrap:wrap}
.demo-banner button{font-size:.75rem;color:var(--blue-ink);min-height:24px}
.filter-tabs{flex-wrap:wrap}
.filter-tabs button{font-size:.875rem;color:var(--sub);min-height:40px;padding:8px 12px}
.filter-tabs button.active{background:var(--blue-soft);color:var(--blue-ink)}
.tool-right label,.sortselect{color:var(--sub);font-size:.8125rem;min-height:36px}
.sortselect{max-width:130px}
.tool-right input{width:17px;height:17px}
.quick-add{background:var(--surface);border-color:var(--line);padding:15px;margin-bottom:24px}
.quick-add input{font-size:1rem;min-width:0;color:var(--text)}
.quick-add .keyhint{font-size:.75rem;color:var(--muted)}
.task-card{background:var(--surface);border-color:var(--line);border-radius:15px;margin-bottom:12px}
.task-card:hover{border-color:var(--accent-border);box-shadow:var(--shadow)}
.task-card.selected{border-color:var(--blue)}
.task-main{gap:13px;padding:18px 16px 16px}
.task-title{font-size:1.0625rem;line-height:1.65}
.task-meta{font-size:.8125rem;gap:8px;color:var(--sub)}
.task-meta .category{color:var(--sub)}
.task-title.done,.step-title.done,.detail-step-main.done,.agenda-info.done strong{color:var(--muted)}
.check{position:relative;width:26px;height:26px;border:1.8px solid var(--check-border);background:var(--surface);margin-top:2px}
.check::before{content:"";position:absolute;inset:-7px;border-radius:50%}
.check:hover{background:var(--blue-soft);border-color:var(--blue)}
.check.checked{background:#326bda;border-color:#326bda;color:#fff}
.check.checked svg{width:17px;height:17px}
.check.small,.agenda-task .check,.detail-step .check{width:24px;height:24px}
.check.small svg,.agenda-task .check svg{width:16px;height:16px}
.task-actions .iconbtn{width:36px;height:36px}
.task-actions svg{width:19px;height:19px}
.flagged{color:var(--amber)!important}
.pill{font-size:.75rem;background:var(--surface-alt);color:var(--sub);padding:3px 7px}
.pill.danger,.group-header.overdue .group-count{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue-ink)}
.pill.green{background:var(--green-soft);color:var(--green)}

  if (!currentUser || !fbDb) return;
  if (cloudSyncTimer) clearTimeout(cloudSyncTimer);
  updateSyncStatus('동기화 중...');
  cloudSyncTimer = setTimeout(() => {
    uploadToCloud();
  }, 1000);
}

async function uploadToCloud(manual = false) {
  if (!currentUser || !fbDb) {
    if (manual) toast('로그인이 필요합니다.');
    return;
  }
  isSyncing = true;
  updateSyncStatus('클라우드 저장 중...');
  try {
    const payloadStr = JSON.stringify(data);
    await fbDb.collection('users').doc(currentUser.uid).collection('workboard').doc('main').set({
      payload: payloadStr,
      updatedAt: data.updatedAt || now(),
      clientTimestamp: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    lastSyncStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    updateSyncStatus('동기화 완료 (' + lastSyncStr + ')');
    if (manual) toast('클라우드에 안전하게 저장되었습니다.');
  } catch (err) {
    console.error('Cloud upload error:', err);
    updateSyncStatus('동기화 실패');
    if (manual) toast('동기화 실패: ' + err.message);
  } finally {
    isSyncing = false;
  }
}

async function downloadFromCloud(manual = false) {
  if (!currentUser || !fbDb) return;
  try {
    const docRef = fbDb.collection('users').doc(currentUser.uid).collection('workboard').doc('main');
    const doc = await docRef.get();
    if (doc.exists) {
      const r = doc.data();
      if (r && r.payload) {
        const remoteData = validateData(JSON.parse(r.payload));
        data = remoteData;
        save(false);
        render();
        lastSyncStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        updateSyncStatus('동기화 완료 (' + lastSyncStr + ')');
        if (manual) toast('클라우드에서 최신 데이터를 불러왔습니다.');
      }
    } else {
      uploadToCloud();
    }
  } catch (err) {
    console.error('Cloud download error:', err);
    if (manual) toast('불러오기 실패: ' + err.message);
  }
}

function listenToCloudChanges(uid) {
  if (cloudUnsub) cloudUnsub();
  const docRef = fbDb.collection('users').doc(uid).collection('workboard').doc('main');
  cloudUnsub = docRef.onSnapshot(snapshot => {
    if (!snapshot.exists || snapshot.metadata.hasPendingWrites) return;
    const r = snapshot.data();
    if (r && r.payload) {
      try {
        const remoteData = validateData(JSON.parse(r.payload));
        if (!data.updatedAt || (remoteData.updatedAt && remoteData.updatedAt > data.updatedAt)) {
          data = remoteData;
          poolCache = null;
          save(false);
          render();
          lastSyncStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
          updateSyncStatus('동기화 완료 (' + lastSyncStr + ')');
          toast('다른 기기에서 변경된 내용을 반영했습니다.');
        }
      } catch (e) {
        console.error('Remote sync parsing error:', e);
      }
    }
  }, err => {
    console.warn('Cloud listener error:', err);
  });
}

async function loginGoogle() {
  if (!fbAuth) { toast('Firebase가 초기화되지 않았습니다.'); return; }
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await fbAuth.signInWithPopup(provider);
  } catch (err) {
    if (err.code === 'auth/popup-blocked') {
      try {
        await fbAuth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
      } catch (e2) {
        toast('로그인 오류: ' + e2.message);
      }
    } else if (err.code === 'auth/unauthorized-domain') {
      toast('Firebase 승인된 도메인에 현재 웹 주소를 추가해야 합니다.');
      alert('Firebase 콘솔 > Authentication > 설정 > 승인된 도메인에\n' + location.hostname + ' 을 추가해 주세요.');
    } else {
      toast('로그인 실패: ' + err.message);
    }
  }
}

async function logoutGoogle() {
  if (!fbAuth) return;
  if (cloudUnsub) { cloudUnsub(); cloudUnsub = null; }

  toast('로그아웃되었습니다. (현재 데이터는 이 브라우저에 유지됩니다)');
}

 const items=[],q=ui.search.trim().toLowerCase();
 for(const t of data.tasks){
 if(ui.calendarList!=='all'&&t.listId!==ui.calendarList)continue;
 const offsets=t.steps.filter(s=>s.due).map(s=>t.repeat?diffDays(t.due,s.due):0);
 const maxOffset=Math.max(0,...offsets),minOffset=Math.min(0,...offsets);
 const dates=t.repeat?repeatDates(t,addDays(from,-maxOffset),addDays(to,-minOffset)):[t.due];
 // Changed recurrence rules must not hide stored completed occurrences.
 if(t.repeat&&ui.showDone)for(const d of Object.keys(t.occurrences))if(d>=from&&d<=to&&!dates.includes(d))dates.push(d);
 for(const d of dates){
 const o=occ(t,d);if(!matchesSearch(o))continue;
 if(o.done&&!ui.showDone)continue;
 if(d>=from&&d<=to)items.push({type:'task',id:t.id,date:d,title:o.t.title,time:o.t.time,occ:o,done:o.done});
 for(const s of o.steps)if(s.due>=from&&s.due<=to&&(!s.done||ui.showDone))items.push({type:'step',id:t.id,date:s.due,title:s.title,time:'',occ:o,stepId:s.id,done:s.done,parent:o.t.title});
 }
 }
 for(const e of data.events)if(e.date>=from&&e.date<=to&&(ui.calendarList==='all'||e.listId===ui.calendarList)&&(!q||[e.title,e.notes,listOf(e.listId).name].join(' ').toLowerCase().includes(q)))items.push({...e,type:'event',done:false});
 return items.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'00:00').localeCompare(b.time||'00:00')||a.title.localeCompare(b.title,'ko'));
}

function stepInputHTML(s,i){
 return `<div class="form-step" data-stepid="${h(s.id||uid())}"><span class="stepidx">${i+1}</span><input class="step-title-input" aria-label="${i+1}번째 단계 제목" maxlength="200" value="${h(s.title||'')}" placeholder="단계에서 할 일"><input class="step-date-input" aria-label="${i+1}번째 단계 날짜" type="date" min="2000-01-01" max="2100-12-31" value="${h(s.due||'')}"><button type="button" class="iconbtn" data-action="form-remove-step" aria-label="단계 삭제">${ico('x','icon-sm')}</button></div>`;
}
function addFormStep(){
 if(document.querySelectorAll('.form-step').length>=100){toast('세부 단계는 최대 100개까지 등록할 수 있습니다.');return}
 $('#formSteps').insertAdjacentHTML('beforeend',stepInputHTML({id:uid(),title:'',due:''},document.querySelectorAll('.form-step').length));
 $('#formSteps').lastElementChild.querySelector('input').focus();
}
function updateEditorType(type){
 if(editContext.id&&((editContext.kind==='event'&&type!=='event')||(editContext.kind!=='event'&&type==='event')))return;
 editContext.type=type;
 document.querySelectorAll('[data-action="editor-type"]').forEach(el=>el.classList.toggle('active',el.dataset.type===type));
 $('#stepsSection').classList.toggle('hidden',type!=='steps');
 $('#repeatSection').classList.toggle('hidden',type==='event');
 $('#priorityField').classList.toggle('hidden',type==='event');
 $('#durationField').classList.toggle('hidden',type!=='event');
 $('#flagField').classList.toggle('hidden',type==='event');
 $('#fDue').required=type==='event'||$('#fRepeat').value!=='none';
 $('#dueLabel').textContent=type==='event'?'일정 날짜':$('#fRepeat').value!=='none'?'첫 실행일 / 반복 기준일':type==='steps'?'업무 최종 마감일':'마감일';
 if(type==='steps'&&!$('#formSteps').children.length)addFormStep();
 document.querySelectorAll('#stepsSection input').forEach(el=>el.disabled=type!=='steps');

function updateRepeatFields(){
 const r=$('#fRepeat').value;
 $('#repeatOptions').classList.toggle('hidden',r==='none');
 $('#monthDayField').classList.toggle('hidden',r!=='monthly');
 $('#weekdayPicker').classList.toggle('hidden',r!=='weekly');
 $('#repeatHelp').textContent=r==='monthly'?'29·30·31일이 없는 달에는 그달의 마지막 날로 처리합니다. 그다음 달은 원래 기준일을 유지합니다.':r==='weekly'?'선택한 요일에 반복합니다. 2주 이상 간격은 첫 실행일이 속한 월요일 시작 주를 기준으로 합니다. 공휴일은 자동 제외하지 않습니다.':'첫 실행일부터 지정한 일수 간격으로 반복합니다. 완료 여부와 무관하게 다음 예정 회차가 유지됩니다.';

function readFormSteps(){return [...document.querySelectorAll('.form-step')].map(el=>({id:el.dataset.stepid,title:el.querySelector('.step-title-input').value.trim(),due:el.querySelector('.step-date-input').value}))}
async function submitEditor(e){
 e.preventDefault();if(!editContext)return;
 const title=$('#fTitle').value.trim(),due=$('#fDue').value,time=$('#fTime').value,listId=$('#fList').value,notes=$('#fNotes').value;
 if(!title)return formError('업무 제목을 입력해 주세요.');
 if(due&&!validDate(due))return formError('날짜는 2000년부터 2100년 사이의 유효한 날짜로 입력해 주세요.');
 if(time&&!due)return formError('시간을 지정하려면 날짜를 먼저 선택해 주세요.');
 const type=editContext.type;
 const old=editContext.id?(editContext.kind==='event'?eventOf(editContext.id):taskOf(editContext.id)):null;
 if(editContext.id&&!old)return formError('이 항목이 다른 창에서 삭제되었습니다. 창을 닫고 다시 확인해 주세요.');
 if(editContext.id&&old&&JSON.stringify(old)!==editContext.baseSnapshot)return formError('편집 중 다른 창에서 이 항목이 변경되었습니다. 현재 입력을 별도로 보관한 뒤 창을 닫고 다시 열어 주세요. 기존 변경사항을 보호하기 위해 저장하지 않았습니다.');
 if(type==='event'){
 if(!due)return formError('일정 날짜를 선택해 주세요.');
 const event={id:old?.id||uid(),title,date:due,time,duration:+$('#fDuration').value,notes,listId};
 $('#editor').close();mutate(()=>{if(old)data.events=data.events.map(x=>x.id===event.id?event:x);else data.events.push(event);ui.day=due;ui.miniMonth=monthFirst(due);ui.selected={type:'event',id:event.id}},old?'일정이 수정되었습니다.':'일정이 추가되었습니다.');
 return;
 }
 const steps=type==='steps'?readFormSteps():[];
 if(type==='steps'&&(!steps.length||steps.some(s=>!s.title)))return formError('세부 단계를 하나 이상 작성하고, 비어 있는 단계는 삭제해 주세요.');
 if(steps.some(s=>s.due&&!validDate(s.due)))return formError('단계 날짜를 확인해 주세요.');
 const freq=$('#fRepeat').value;
 let repeat=null;
 if(freq!=='none'){
 if(!due)return formError('반복 업무의 첫 실행일을 선택해 주세요.');
 const interval=+$('#fInterval').value,weekdays=[...document.querySelectorAll('input[name=repeatDay]:checked')].map(el=>+el.value),until=$('#fUntil').value;
 if(!Number.isInteger(interval)||interval<1||interval>99)return formError('반복 간격은 1~99의 정수로 입력해 주세요.');
 if(freq==='weekly'&&!weekdays.length)return formError('반복할 요일을 하나 이상 선택해 주세요.');
 if(until&&(!validDate(until)||until<due))return formError('반복 종료일은 첫 실행일 이후로 지정해 주세요.');
 repeat={freq,interval,weekdays,monthDay:$('#fMonthDay').value==='last'?'last':+$('#fMonthDay').value,until};
 const test={due,repeat};
 if(!repeatDates(test,due,until||addDays(due,interval*370)).length)return formError('설정한 기간에 반복 회차가 없습니다. 시작일, 반복 요일 또는 종료일을 조정해 주세요.');
 }
 if(old?.repeat&&!repeat&&Object.keys(old.occurrences).length){
 if(!await confirmAction('반복을 해제할까요?','반복을 해제하면 현재 선택한 회차를 단일 업무로 남기고, 다른 회차의 체크 이력은 제거합니다. 중요한 이력이 있다면 먼저 JSON으로 백업해 주세요.','반복 해제'))return;
 }
 if(old?.steps?.length&&type==='task'){
 if(!await confirmAction('단일 업무로 변경할까요?','등록된 세부 단계가 모두 삭제됩니다.','변경'))return;
 }
 if(editContext.id&&JSON.stringify(editContext.kind==='event'?eventOf(editContext.id):taskOf(editContext.id))!==editContext.baseSnapshot)return formError('다른 창에서 이 업무가 변경되었습니다. 편집창을 다시 열어 주세요.');
 let state=old?clone(old.state):defaultState(),occurrences=old?clone(old.occurrences):{};
 if(old?.repeat&&!repeat){state=clone(stateOf(old,editContext.date||old.due));occurrences={}}
 if(old?.repeat&&repeat){
   for(const [date,s] of Object.entries(occurrences))if(s.completedAt&&!s.snapshot)s.snapshot=completedSnapshot(old,date);
 }
 if(!old?.repeat&&repeat){occurrences={};if(old&&(old.state.completedAt||Object.keys(old.state.stepDone).length||old.state.status!=='todo')){const first=repeatDates({due,repeat},due,addDays(due,repeat.interval*370))[0];occurrences[first]=clone(old.state)}state=defaultState()}
 const t={id:old?.id||uid(),title,listId,due,time,notes,steps,priority:$('#fPriority').value,flagged:$('#fFlag').checked,repeat,state,occurrences,createdAt:old?.createdAt||now(),updatedAt:now()};
 // Keep completion consistent when the set of steps is edited.
 const reconcile=s=>{
   const keep=new Set(steps.map(x=>x.id));
   for(const k of Object.keys(s.stepDone))if(!keep.has(k))delete s.stepDone[k];
   if(steps.length&&s.completedAt&&!steps.every(x=>s.stepDone[x.id]))s.completedAt=null;
 };
 reconcile(t.state);Object.values(t.occurrences).forEach(s=>{if(!s.completedAt)reconcile(s)});
 const occurrenceDate=t.repeat?(editContext.date&&old?.repeat?editContext.date:repeatDates(t,due,addDays(due,repeat.interval*370))[0]):t.due;
 $('#editor').close();
 mutate(()=>{if(old)data.tasks=data.tasks.map(x=>x.id===t.id?t:x);else data.tasks.push(t);ui.selected={type:'task',id:t.id,date:occurrenceDate};if(ui.nav==='completed')ui.nav='all'},old?'업무가 수정되었습니다.':'새 업무가 추가되었습니다.');
}
async function toggleTask(id,d){
 const t=taskOf(id);if(!t)return;
 const o=occ(t,t.repeat?d:t.due),remaining=o.steps.filter(s=>!s.done).length;
 if(!o.done&&remaining&& !await confirmAction('업무 전체를 완료할까요?',`아직 완료하지 않은 ${remaining}개 단계도 함께 완료합니다.`,'전체 완료'))return;
 if(o.done&&t.steps.length&& !await confirmAction('업무를 다시 시작할까요?','상위 업무와 모든 단계를 미완료로 되돌립니다.','완료 취소'))return;
 mutate(()=>{
 const s=stateOf(t,o.date,true);s.completedAt=o.done?null:now();
 if(o.done)s.stepDone={};
 for(const step of t.steps)s.stepDone[step.id]=o.done?false:now();
 if(o.done){s.status='todo';delete s.snapshot}
 else if(t.repeat)s.snapshot=completedSnapshot(t,o.date);
 },o.done?'완료를 취소했습니다.':t.repeat?'이번 회차가 완료되었습니다. 다음 회차는 별도로 유지됩니다.':'업무가 완료되었습니다.');
}
function toggleStep(id,d,sid){
 const t=taskOf(id);if(!t)return;
 if(!t.steps.some(s=>s.id===sid)){toast('완료 당시의 단계입니다. 상위 업무의 완료를 취소하면 현재 단계 구성으로 다시 시작합니다.');return}
 const state=stateOf(t,t.repeat?d:t.due),wasDone=!!state.stepDone[sid];
 mutate(()=>{
 const s=stateOf(t,t.repeat?d:t.due,true);s.stepDone[sid]=wasDone?false:now();
 if(wasDone){s.completedAt=null;s.status='doing';delete s.snapshot}
 else if(t.steps.every(x=>s.stepDone[x.id])){s.completedAt=now();if(t.repeat)s.snapshot=completedSnapshot(t,t.repeat?d:t.due)}
 else if(s.status==='todo')s.status='doing';
 },wasDone?'단계 완료를 취소했습니다.':t.steps.every(x=>x.id===sid||state.stepDone[x.id])?'모든 단계와 업무가 완료되었습니다.':'단계가 완료되었습니다.');
}
function duplicateTask(id,d){
 const t=taskOf(id);if(!t)return;
 const copy=clone(t);copy.id=uid();copy.title=t.title+' (복사)';copy.state=defaultState();copy.occurrences={};copy.steps=copy.steps.map(s=>({...s,id:uid()}));copy.createdAt=now();copy.updatedAt=now();
 mutate(()=>{data.tasks.push(copy);ui.selected={type:'task',id:copy.id,date:t.repeat?d:copy.due}},'업무를 복제했습니다. 일정은 원본과 동일하므로 확인해 주세요.');
}
function quickAdd(title){
 title=title.trim();if(!title)return;
 const t={id:uid(),title,listId:ui.nav.startsWith('list:')?ui.nav.slice(5):data.lists[0].id,due:ui.nav==='inbox'?'':todayKey(),time:'',notes:'',priority:'normal',flagged:ui.nav==='flagged',steps:[],repeat:null,state:defaultState(),occurrences:{},createdAt:now(),updatedAt:now()};
 if(ui.nav==='planned')t.due=addDays(todayKey(),1);
 if(ui.nav==='projects'||ui.nav==='repeat'){editorOpen('task',null,null,t.due);$('#fTitle').value=title;if(ui.nav==='projects')updateEditorType('steps');else{$('#fRepeat').value='weekly';updateRepeatFields()}return}

function download(content,name,type){
 const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function exportJSON(){download(JSON.stringify({...data,exportedAt:now()},null,2),`업무노트_백업_${todayKey()}.json`,'application/json;charset=utf-8');toast('전체 업무·회차 이력·일정을 백업 파일로 저장했습니다.')}
function csvValue(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function exportCSV(){
 const rows=[['유형','업무명','분류','마감일','시간','상태','우선순위','반복','완료 단계','전체 단계','메모']];
 for(const o of pool()){rows.push([o.t.steps.length?'단계별 업무':'단일 업무',o.t.title,listOf(o.t.listId).name,o.date,o.t.time,o.done?'완료':STATUS[o.state.status],PRIORITY[o.t.priority],repeatLabel(o.t),o.doneSteps,o.steps.length,o.t.notes])}
 for(const e of data.events)rows.push(['회의·일정',e.title,listOf(e.listId).name,e.date,e.time,'일정','','','','',e.notes]);
 download('\ufeff'+rows.map(r=>r.map(csvValue).join(',')).join('\r\n'),`업무노트_목록_${todayKey()}.csv`,'text/csv;charset=utf-8');
 toast('CSV 목록을 저장했습니다. 반복 업무는 향후 35일과 이후 첫 미완료 회차를 포함합니다.');
}
const icsEscape=s=>String(s??'').replaceAll('\\','\\\\').replaceAll('\n','\\n').replaceAll(';','\\;').replaceAll(',','\\,').replaceAll('\r','');
function foldICS(line){
 const enc=new TextEncoder();let parts=[],part='',len=0;
 for(const ch of line){const size=enc.encode(ch).length;if(len+size>73){parts.push(part);part=' '+ch;len=1+size}else{part+=ch;len+=size}}
 parts.push(part);return parts.join('\r\n');
}
function exportICS(){
 let from,to;
 if(ui.mode==='calendar'&&ui.calendarMode==='week'){from=ui.week;to=addDays(from,6)}else{from=ui.mode==='calendar'?ui.month:monthFirst(ui.day);to=monthLast(from)}
 const items=calendarItems(from,to),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
 const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Worknote//Task Calendar Prototype//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:업무노트'];
 for(const i of items){
 const id=`${i.id}-${i.date}-${i.stepId||i.type}@worknote.local`;
 lines.push('BEGIN:VEVENT','UID:'+id,'DTSTAMP:'+stamp);
 if(i.time){
 const start=new Date(i.date+'T'+i.time+':00+09:00'),end=new Date(start.getTime()+(i.type==='event'?i.duration:15)*60000);
 const fmt=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
 lines.push('DTSTART:'+fmt(start),'DTEND:'+fmt(end));
 }else lines.push('DTSTART;VALUE=DATE:'+i.date.replaceAll('-',''),'DTEND;VALUE=DATE:'+addDays(i.date,1).replaceAll('-',''));
 const title=(i.type==='event'?'':i.type==='step'?'[단계] ':'[할 일] ')+i.title;
 lines.push('SUMMARY:'+icsEscape(title),'DESCRIPTION:'+icsEscape((i.parent?i.parent+'\n':'')+(i.type==='event'?i.notes:i.occ.t.notes)+'\n업무노트에서 내보낸 일정 사본입니다. 완료 상태는 동기화되지 않습니다.'),'TRANSP:TRANSPARENT','END:VEVENT');
 }
 lines.push('END:VCALENDAR');download(lines.map(foldICS).join('\r\n')+'\r\n',`업무노트_일정_${from}_${to}.ics`,'text/calendar;charset=utf-8');
 toast(`${items.length}개 항목을 일정 사본으로 저장했습니다. 실제 동기화는 아닙니다.`);
}
async function importJSON(file){
 if(!file)return;
 if(file.size>10*1024*1024){toast('10MB 이하의 JSON 백업 파일을 선택해 주세요.');return}
 let next;try{next=validateData(JSON.parse(await file.text()))}catch(e){toast('불러오기 실패: '+e.message);return}
 if(!await confirmAction('백업 자료를 복원할까요?',`현재 자료를 백업 파일의 업무 ${next.tasks.length}건, 일정 ${next.events.length}건으로 교체합니다.\n현재 자료가 필요하면 취소한 뒤 먼저 백업해 주세요.`,'교체하여 복원'))return;
 blockedStorage=false;
 mutate(()=>{data=next;ui.selected=null;ui.nav='all';ui.mode='list';ui.calendarList='all';ui.search='';ui.filter='all'},'백업 자료가 복원되었습니다.');
 $('#settings').close();
}
function settingsOpen(helpOnly=false){

 ${!helpOnly?cloudSettingsHTML()+appearanceHTML()+deviceCardHTML():''}
 ${!helpOnly?`<div class="settings-grid"><div class="settings-card"><h3>${ico('download','icon-sm')}전체 데이터 백업</h3><p>업무·세부 단계·반복 회차의 완료 이력·일정을 JSON으로 저장합니다.</p><button class="secondary" data-action="export-json">JSON 백업</button></div><div class="settings-card"><h3>${ico('upload','icon-sm')}백업 복원</h3><p>이 시스템에서 저장한 JSON으로 복원합니다. 현재 자료를 교체합니다.</p><button class="secondary" data-action="import-json">백업 불러오기</button></div><div class="settings-card"><h3>${ico('list','icon-sm')}업무 목록 내보내기</h3><p>업무 목록을 CSV로 저장합니다. 반복 회차는 향후 35일까지와 이후 첫 미완료 회차를 포함합니다.</p><button class="secondary" data-action="export-csv">CSV 내보내기</button></div><div class="settings-card"><h3>${ico('calendar','icon-sm')}캘린더 사본 저장</h3><p>현재 월/주의 표시 항목을 ICS 일정으로 저장합니다. 양방향 동기화가 아닙니다.</p><button class="secondary" data-action="export-ics">ICS 내보내기</button></div></div>`:''}
 <div class="howto"><h3>01. 할 일을 적고, 날짜를 정하세요.</h3><p>상단의 「업무 추가」에서 단일 업무, 단계별 업무, 회의·일정을 선택합니다. 목록의 빠른 입력칸에서는 제목만 입력해 추가할 수 있습니다. 빠른 추가는 기본적으로 오늘 마감이며, 「날짜 없음」에서는 날짜 없이 등록됩니다.</p>
 <h3>02. 큰 업무는 작은 단계로 나누세요.</h3><p>단계별 업무는 각 단계에 별도의 처리일을 지정할 수 있습니다. 마지막 단계를 완료하면 상위 업무도 자동 완료됩니다. 상위 업무를 먼저 완료하면 미완료 단계를 함께 완료할지 확인합니다. 상위 업무의 완료를 취소하면 모든 단계도 미완료로 돌아갑니다.</p>
 <h3>03. 반복 업무는 회차별로 관리하세요.</h3><p>매일, 매주(복수 요일), 매월 및 2주·3개월 같은 간격을 지정할 수 있습니다. 29~31일이 없는 달은 말일로 보정하고 다음 달에는 원래 기준일로 돌아갑니다. 매월 말일과 반복 종료일도 지정할 수 있습니다. 주 단위의 기준은 월요일 시작 주이며, 공휴일은 별도로 반영하지 않습니다.</p><p>반복 업무를 완료해도 이전 회차의 기록과 다음 회차는 분리됩니다. 날짜가 지난 미완료 회차도 숨기지 않습니다. 「전체·반복·분류별」 목록은 업무별 가장 이른 미완료 회차를, 「예정」은 앞으로 30일을 보여줍니다. 캘린더는 선택한 기간의 반복 회차를 미리 표시합니다.</p>
 <h3>04. 목록과 캘린더는 같은 데이터를 보여줍니다.</h3><p>날짜가 있는 업무, 개별 단계, 회의·일정이 캘린더에 함께 표시됩니다. 날짜를 클릭하면 해당 날짜 전체 항목이 열리고, 날짜를 두 번 클릭하면 새 업무를 등록합니다. 일반 업무의 날짜를 끌어 옮기면 세부 단계도 같은 간격으로 이동합니다. 반복 회차는 끌어 이동하지 않으며 업무 수정에서 반복 규칙을 변경합니다.</p>
 <h3>05. 저장 방식과 초안의 범위</h3><p><strong>이 웹 시스템은 별도 로그인 없이 브라우저 로컬 저장소에서 단독 실행되는 시스템입니다.</strong> 서버·로그인·다중 사용자 공유·푸시 알림·Apple/iCloud 실시간 연동은 포함하지 않습니다. 페이지를 닫은 상태의 알림도 제공하지 않습니다. 시간은 일정 표시용이며 팝업 알림 기능은 아닙니다.</p><p>현재 브라우저의 로컬 저장소를 이용하므로 브라우저 변경, 비공개 창, 저장자료 삭제, 파일 위치 변경 등에 따라 기존 자료를 읽지 못할 수 있습니다. HTML 파일 자체에 입력 데이터가 다시 기록되는 방식이 아닙니다. 파일을 다른 PC로 옮길 때는 JSON 백업도 함께 복원해 주세요. 업무 날짜와 ICS 시간 기준은 한국 표준시(Asia/Seoul)입니다.</p><p>폰트는 첨부 참고 자료와 동일한 Paperlogy를 외부 CDN에서 불러옵니다. 인터넷이 차단되면 기기의 기본 한글 폰트로 표시되지만 핵심 업무 기능은 동작합니다. 폰트 파일은 이 HTML에 포함하지 않았습니다.</p>
 <h3>화면을 빠르게 이동하세요.</h3><p><strong>N</strong> 새 업무 · <strong>/</strong> 검색 · <strong>Esc</strong> 창 닫기 · <strong>Enter</strong> 빠른 추가. 입력 중에는 단축키가 작동하지 않습니다.</p>
 <h3>참고한 구성</h3><p>사용자가 첨부한 index.html의 Paperlogy 폰트 선언을 참고했습니다. Apple의 미리 알림·캘린더처럼 예정된 할 일을 일정과 함께 확인하고 완료하는 사용 흐름을 참고하되, 이 초안은 독립된 시스템입니다.</p><p><a href="https://support.apple.com/ko-kr/guide/iphone/iph14f1d32a5/27/ios/27" target="_blank" rel="noopener noreferrer">Apple 지원 · 캘린더에서 미리 알림 사용하기</a><br><a href="https://support.apple.com/ko-kr/102484" target="_blank" rel="noopener noreferrer">Apple 지원 · 미리 알림 사용하기</a></p></div>
 ${!helpOnly?`<div class="form-section"><div class="form-section-head">데이터 초기화</div><p class="helptext">등록된 모든 업무와 일정을 비우고 새로 시작할 수 있습니다. (업무 분류는 유지됩니다) 기존 자료가 삭제되므로 필요한 경우 먼저 JSON 백업을 받아두세요.</p><div style="display:flex;gap:8px"><button class="secondary danger-btn" data-action="start-empty">전체 업무·일정 비우기</button></div></div>`:''}
 </div><div class="modal-footer"><button class="primary" data-action="close-settings">확인</button></div>`;

}
function listOpen(){
 $('#listName').value='';$('#colorPicker').innerHTML=COLORS.map((c,i)=>`<label style="--dot:${c}"><input type="radio" name="listColor" value="${c}" ${!i?'checked':''} aria-label="분류 색상 ${i+1}"><span class="dot" style="--dot:${c}"></span></label>`).join('');
 $('#listDialog').showModal();$('#listName').focus();
}
function closeMenu(){$('#sidebar').classList.remove('mobile-open');$('#mobileShade').classList.remove('show')}
function openDay(d){
 ui.day=d;ui.miniMonth=monthFirst(d);ui.selected=(window.innerWidth<=1280||ui.widget)?{type:'day'}:null;renderPanel();
 document.querySelectorAll('.day-cell,.week-col').forEach(el=>el.classList.toggle('selected',el.dataset.dropDate===d));
}
async function action(el,e){
 const a=el.dataset.action,id=el.dataset.id,d=el.dataset.date;
 switch(a){
 case 'firebase-login': loginGoogle(); break;
 case 'firebase-logout': logoutGoogle(); break;
 case 'sync-now': uploadToCloud(true); break;
 case 'sync-download': downloadFromCloud(true); break;
 case 'theme-toggle':prefs.theme=themeResolved()==='dark'?'light':'dark';storePrefs();break;
 case 'set-theme':if(['light','dark','system'].includes(el.dataset.value)){prefs.theme=el.dataset.value;storePrefs()}break;
 case 'set-size':if(['comfortable','large','xlarge'].includes(el.dataset.value)){prefs.size=el.dataset.value;storePrefs()}break;
 case 'open-widget':launchWidget();break;
 case 'mini-here':document.querySelectorAll('dialog[open]').forEach(d=>d.close());location.hash='mini';setMiniMode(true);break;
 case 'exit-widget':location.hash='';setMiniMode(false);break;
 case 'device-guide':deviceGuideOpen();break;
 case 'close-device-guide':$('#deviceGuide').close();break;
 case 'install-app':await installApp();break;
 case 'widget-filter':ui.widgetFilter=el.dataset.value;ui.nav=ui.widgetFilter==='flagged'?'flagged':ui.widgetFilter==='week'?'all':'today';ui.limit=60;ui.selected=null;renderCenter();renderPanel();break;

 case 'nav':ui.nav=el.dataset.nav;ui.mode='list';ui.selected=null;ui.filter='all';ui.limit=60;ui.search='';closeMenu();render();break;
 case 'mode':if(el.dataset.mode==='calendar'&&ui.nav.startsWith('list:'))ui.calendarList=ui.nav.slice(5);ui.mode=el.dataset.mode;ui.selected=null;ui.filter='all';ui.limit=60;render();break;
 case 'filter':ui.filter=el.dataset.filter;ui.limit=60;renderCenter();break;
 case 'new-task':editorOpen();break;
 case 'new-on-day':editorOpen('task',null,null,el.dataset.day);break;
 case 'close-editor':$('#editor').close();break;
 case 'editor-type':updateEditorType(el.dataset.type);break;
 case 'form-add-step':addFormStep();break;
 case 'form-remove-step':el.closest('.form-step').remove();document.querySelectorAll('.stepidx').forEach((n,i)=>n.textContent=i+1);break;
 case 'select-task':ui.selected={type:'task',id,date:d};renderPanel();renderCenter();break;
 case 'select-event':ui.selected={type:'event',id};renderPanel();break;
 case 'close-detail':ui.selected=null;renderPanel();renderCenter();break;
 case 'toggle-task':await toggleTask(id,d);break;
 case 'toggle-step':toggleStep(id,d,el.dataset.step);break;
 case 'expand':{const k=id+'|'+d;ui.expanded.has(k)?ui.expanded.delete(k):ui.expanded.add(k);renderCenter();break}
 case 'flag':mutate(()=>{const t=taskOf(id);t.flagged=!t.flagged},'중요 표시를 변경했습니다.');break;
 case 'edit-task':editorOpen('task',id,d);break;
 case 'edit-event':editorOpen('event',id);break;
 case 'duplicate-task':duplicateTask(id,d);break;
 case 'delete-task':{const t=taskOf(id);if(t&&await confirmAction('업무를 삭제할까요?',t.repeat?'반복 업무 전체와 모든 회차의 완료 이력이 함께 삭제됩니다.':'업무와 세부 단계가 함께 삭제됩니다.','삭제')){mutate(()=>{data.tasks=data.tasks.filter(x=>x.id!==id);ui.selected=null},'업무를 삭제했습니다.')}break}
 case 'delete-event':if(await confirmAction('일정을 삭제할까요?','이 일정이 캘린더에서 삭제됩니다.','삭제'))mutate(()=>{data.events=data.events.filter(x=>x.id!==id);ui.selected=null},'일정을 삭제했습니다.');break;
 case 'select-day':openDay(el.dataset.day);break;
 case 'cal-mode':ui.calendarMode=el.dataset.mode;ui.week=weekFirst(ui.day);ui.month=monthFirst(ui.day);renderCenter();break;
 case 'cal-prev':case 'cal-next':{const n=a==='cal-prev'?-1:1;if(ui.calendarMode==='month')ui.month=shiftMonth(ui.month,n);else ui.week=addDays(ui.week,n*7);renderCenter();break}
 case 'mini-prev':case 'mini-next':ui.miniMonth=shiftMonth(ui.miniMonth,a==='mini-prev'?-1:1);renderPanel();break;
 case 'cal-today':ui.day=todayKey();ui.month=monthFirst(ui.day);ui.week=weekFirst(ui.day);ui.miniMonth=ui.month;ui.selected=null;render();break;
 case 'load-more':ui.limit+=60;renderCenter();break;
 case 'clear-search':ui.search='';render();break;
 case 'settings':settingsOpen();break;
 case 'help':settingsOpen(true);break;
 case 'close-settings':$('#settings').close();break;
 case 'new-list':listOpen();break;
 case 'close-list':$('#listDialog').close();break;
 case 'export-json':exportJSON();break;
 case 'export-csv':exportCSV();break;
 case 'export-ics':exportICS();break;
 case 'import-json':$('#importFile').value='';$('#importFile').click();break;
 case 'reset-demo':if(await confirmAction('예시 자료로 교체할까요?','현재 업무와 일정을 모두 지우고 예시 자료를 다시 넣습니다.','교체')){blockedStorage=false;mutate(()=>{data=seed();ui.selected=null;ui.nav='today';ui.calendarList='all'},'예시 자료로 교체했습니다.');$('#settings').close()}break;
 case 'start-empty':if(await confirmAction('빈 목록으로 시작할까요?','현재 업무·일정·완료 이력이 모두 삭제됩니다. 업무 분류는 유지됩니다. 자료가 필요하면 먼저 백업해 주세요.','모두 비우기')){blockedStorage=false;mutate(()=>{data.tasks=[];data.events=[];data.demo=false;ui.selected=null;ui.nav='today';ui.search=''},'빈 목록으로 시작합니다.');$('#settings').close()}break;
 case 'undo':if(undoState){data=undoState;undoState=null;ui.selected=null;save();render();toast('마지막 변경을 되돌렸습니다.')}break;
 case 'open-menu':$('#sidebar').classList.add('mobile-open');$('#mobileShade').classList.add('show');break;
 case 'close-menu':closeMenu();break;
 }
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;
 if(el.hasAttribute('disabled'))return;e.stopPropagation();
 action(el,e).catch(err=>{console.error(err);toast('처리 중 문제가 발생했습니다. 자료를 백업한 뒤 다시 확인해 주세요.')});
});
document.addEventListener('dblclick',e=>{
 const el=e.target.closest('.day-cell');if(el&&!e.target.closest('.calitem'))editorOpen('task',null,null,el.dataset.day);
});
document.addEventListener('input',e=>{
 if(e.target.id==='searchInput'){
 const el=e.target,start=el.selectionStart;ui.search=el.value;ui.limit=60;renderCenter();renderPanel();
 }
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='showDone'){ui.showDone=el.checked;renderCenter();renderPanel()}
 if(el.id==='sortSelect'){ui.sort=el.value;renderCenter()}
 if(el.id==='calendarList'){ui.calendarList=el.value;renderCenter();renderPanel()}
 if(el.id==='fRepeat')updateRepeatFields();
 if(el.id==='detailStatus'){const t=taskOf(el.dataset.id);mutate(()=>{stateOf(t,el.dataset.date,true).status=el.value},'진행 상태를 변경했습니다.')}
 if(el.id==='importFile')importJSON(el.files[0]);
});
document.addEventListener('submit',e=>{
 if(e.target.id==='quickForm'){e.preventDefault();quickAdd($('#quickTitle').value)}
 if(e.target.id==='editForm')submitEditor(e).catch(err=>{console.error(err);formError('저장 중 문제가 발생했습니다. 입력 내용을 확인해 주세요.')});
 if(e.target.id==='listForm'){
 e.preventDefault();const name=$('#listName').value.trim();if(!name)return;
 if(data.lists.some(l=>l.name===name)){toast('같은 이름의 분류가 이미 있습니다.');return}
 const id=uid(),color=document.querySelector('input[name=listColor]:checked').value;
 $('#listDialog').close();mutate(()=>{data.lists.push({id,name,color});ui.nav='list:'+id;ui.mode='list';ui.selected=null},'새 업무 분류가 추가되었습니다.');
 }
});
document.addEventListener('keydown',e=>{
 const input=e.target.closest('input,textarea,select,[contenteditable=true]');
 if(input)return;
 if(e.key==='Enter'&&e.target.matches('[role=button]')){e.preventDefault();e.target.click();return}
 if(document.querySelector('dialog[open]'))return;
 if(e.key==='/'&&$('#searchInput')){e.preventDefault();$('#searchInput').focus()}
 if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();editorOpen()}
 if(e.key==='Escape'){ui.selected=null;renderPanel();closeMenu()}
});
let dragPayload=null;
document.addEventListener('dragstart',e=>{
 const el=e.target.closest('[data-drag-type]');if(!el)return;
 dragPayload={type:el.dataset.dragType,id:el.dataset.dragId,step:el.dataset.dragStep};
 e.dataTransfer.setData('application/json',JSON.stringify(dragPayload));e.dataTransfer.effectAllowed='move';
});
document.addEventListener('dragover',e=>{const cell=e.target.closest('[data-drop-date]');if(cell&&dragPayload){e.preventDefault();e.dataTransfer.dropEffect='move';cell.classList.add('dragover')}});
document.addEventListener('dragleave',e=>{const cell=e.target.closest('[data-drop-date]');if(cell&&!cell.contains(e.relatedTarget))cell.classList.remove('dragover')});
document.addEventListener('dragend',()=>{dragPayload=null;document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'))});
document.addEventListener('drop',e=>{
 const cell=e.target.closest('[data-drop-date]');if(!cell||!dragPayload)return;
 e.preventDefault();const d=cell.dataset.dropDate,payload=dragPayload;dragPayload=null;
 if(!validDate(d))return;
 if(payload.type==='event'){
 const ev=eventOf(payload.id);if(ev)mutate(()=>{ev.date=d;ui.day=d;ui.selected=null},'일정을 이동했습니다.');return;
 }
 const t=taskOf(payload.id);if(!t||t.repeat)return;
 mutate(()=>{
 if(payload.type==='step'){const step=t.steps.find(s=>s.id===payload.step);if(step)step.due=d}
 else {const delta=t.due?diffDays(t.due,d):0;t.due=d;for(const s of t.steps)if(s.due)s.due=addDays(s.due,delta)}
 ui.day=d;ui.selected=null;
 },payload.type==='step'?'단계 일정을 이동했습니다.':'업무와 세부 단계 일정을 함께 이동했습니다.');
});
window.addEventListener('storage',e=>{
 if(e.key===KEY&&e.newValue){try{data=validateData(JSON.parse(e.newValue));poolCache=null;undoState=null;render();toast('다른 창의 변경사항을 반영했습니다. 열려 있는 편집 내용은 저장할 때 적용됩니다.')}catch(err){toast('다른 창의 저장자료를 읽지 못했습니다. 새로고침 전에 백업해 주세요.')}}
});

/* Worknote 02: appearance, compact window, installation guide. */
const PREF_KEY='worknote.preferences.v2';
let prefs={theme:'system',size:'comfortable'};
try{
 const stored=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');
 if(['system','light','dark'].includes(stored.theme))prefs.theme=stored.theme;
 if(['comfortable','large','xlarge'].includes(stored.size))prefs.size=stored.size;
}catch(_){}
const themeQuery=matchMedia('(prefers-color-scheme: dark)');
let installPrompt=null, offlineReady=false, offlineIssue='';
function themeResolved(){return prefs.theme==='system'?(themeQuery.matches?'dark':'light'):prefs.theme}
function applyAppearance(){
 document.documentElement.dataset.theme=themeResolved();
 document.documentElement.dataset.size=prefs.size;
 const meta=document.querySelector('meta[name="theme-color"]');
 if(meta)meta.content=themeResolved()==='dark'?'#161d28':'#ffffff';
 document.querySelectorAll('[data-action="theme-toggle"]').forEach(b=>{
  const dark=themeResolved()==='dark';
  b.innerHTML=ico(dark?'sun':'moon');

 });

 document.querySelectorAll('[data-action="set-size"]').forEach(b=>{b.classList.toggle('active',b.dataset.value===prefs.size);b.setAttribute('aria-pressed',String(b.dataset.value===prefs.size))});

function installationState(){
 if(!document.querySelector('meta[name="worknote-pwa"]'))return '단독 HTML 실행본입니다. 앱 설치와 오프라인 재실행은 PWA 배포용 폴더를 HTTPS 서버에 올린 뒤 이용해 주세요.';
 if(location.protocol==='file:')return 'PWA 파일을 직접 열었습니다. 앱 설치용 기능은 HTTPS 주소 또는 개발용 localhost에서 실행해야 합니다.';
 if(!isSecureContext)return '현재 주소는 보안 연결이 아닙니다. HTTPS 주소가 필요합니다.';
 if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return offlineReady?'앱 형태로 실행 중 · 오프라인 화면 준비 완료':'앱 형태로 실행 중';
 if(offlineIssue)return '오프라인 화면 저장을 완료하지 못했습니다. 서버 연결과 배포 파일을 확인해 주세요.';
 return offlineReady?'웹 배포본 실행 중 · 오프라인 화면 준비 완료':'웹 배포본 실행 중 · 오프라인 화면 준비 중';
}

 <section class="device-card"><h3>${ico('monitor')}Windows PC에 앱처럼 설치</h3><p>PWA 배포본을 <strong>HTTPS 웹주소</strong>로 운영한 뒤 Edge에서 접속합니다. 주소창의 앱 설치 아이콘 또는 메뉴의 「앱 → 이 사이트를 앱으로 설치」를 사용하세요. 메뉴 위치는 브라우저 버전에 따라 달라질 수 있습니다. 설치 후 작업표시줄·시작 메뉴에 고정하고 자동 시작을 설정할 수 있습니다.</p><button class="secondary" data-action="install-app">앱 설치</button><p class="install-state" id="installState">${h(installationState())}</p></section>
 <section class="device-card"><h3>${ico('phone')}휴대폰 홈 화면에서 사용</h3><p><strong>iPhone:</strong> Safari에서 배포 주소 접속 → 공유 → 홈 화면에 추가 → 제공되는 경우 「웹 앱으로 열기」를 켭니다.<br><strong>Android:</strong> Chrome에서 배포 주소 접속 → 메뉴 → 설치 및 바로가기 만들기 → 설치를 선택합니다. 버전에 따라 「홈 화면에 추가」로 표시될 수 있습니다.</p><p>휴대폰에서 HTML 첨부파일을 미리보기로 여는 방식 대신, 브라우저에서 HTTPS 주소로 접속하는 방식을 권장합니다. 최초 온라인 접속 후 화면 저장이 완료되면 네트워크가 끊겨도 해당 기기에 저장한 자료를 사용할 수 있습니다. 기기 저장소 정리 시 자료가 사라질 수 있으므로 백업해 주세요.</p></section>
 <section class="device-card"><h3>${ico('devices')}PC · 휴대폰 자동 동기화 구축안</h3><p><strong>공통 웹주소 + 로그인 + 서버 데이터베이스 + 동기화 처리</strong>가 추가로 필요합니다. 현재 ZIP에는 화면·앱 설치·오프라인 구성을 담았으며 서버와 로그인은 포함하지 않았습니다.</p><p>기관 업무자료는 기관이 허용한 서버·접근 경로에 보관하는 구성을 권장합니다. 내부망 전용 주소는 휴대폰에서 바로 접속되지 않을 수 있어, 외부 접속 허용 여부나 기관 VPN을 먼저 확인해야 합니다.</p><p>임시 이동은 「JSON 백업 → 다른 기기에서 복원」으로 할 수 있습니다. 복원은 기존 자료를 교체하며, 양쪽 자료를 자동 병합하지 않습니다. 한 기기에서만 수정한 뒤 옮겨 주세요.</p></section>
 <div class="howto"><h3>공식 사용 안내</h3><p><a href="https://learn.microsoft.com/en-us/microsoft-edge/progressive-web-apps/ux" target="_blank" rel="noopener noreferrer">Microsoft · PWA 설치 및 Windows 연동</a><br><a href="https://learn.microsoft.com/ko-kr/windows/powertoys/always-on-top" target="_blank" rel="noopener noreferrer">Microsoft · Always On Top</a><br><a href="https://support.apple.com/guide/iphone/iphea86e5236/ios" target="_blank" rel="noopener noreferrer">Apple · 홈 화면에 웹 앱 추가</a><br><a href="https://learn.microsoft.com/en-us/windows/apps/develop/widgets/widget-providers" target="_blank" rel="noopener noreferrer">Microsoft · Windows 위젯 개발</a></p></div>
 </div><div class="modal-footer"><button class="primary" data-action="close-device-guide">확인</button></div>`;
 if(!dlg.open)dlg.showModal();
}
function launchWidget(){
 const url=new URL(location.href);url.hash='mini';
 const left=Math.max(0,window.screen.availWidth-490);
 const w=window.open(url.href,'worknote-mini','popup=yes,width=460,height=740,left='+left+',top=70,resizable=yes,scrollbars=yes');
 if(!w){toast('팝업이 차단되었습니다. 설정에서 「이 창에서 미니 보기」를 선택해 주세요.');return}
 try{w.focus()}catch(_){}
}
function setMiniMode(on){
 ui.widget=on;ui.selected=null;ui.mode='list';ui.nav='today';ui.search='';ui.filter='all';ui.limit=60;
 ui.widgetFilter='today';document.body.classList.toggle('widget-mode',on);
 document.title=on?'업무노트 · 미니창':'업무노트 · 업무 관리';
 closeMenu();render();
}
function syncHash(){setMiniMode(location.hash==='#mini')}
function widgetCenterHTML(){
 const today=todayKey(),filter=ui.widgetFilter||'today';
 const items=(filter==='week'?pool().filter(o=>!o.done&&o.effective&&o.effective<=addDays(today,6)).sort((a,b)=>a.effective.localeCompare(b.effective)||(a.t.time||'').localeCompare(b.t.time||'')):currentList().filter(o=>!o.done));
 const title=filter==='week'?'7일 이내 업무':filter==='flagged'?'중요한 업무':'오늘의 업무';
 let html=`<div class="mini-heading"><div><h2>${title}</h2><p>${fullDate(today)} · 지연 업무 포함</p></div><div class="mini-count" aria-label="${items.length}건">${items.length}</div></div>
 <div class="filter-tabs" aria-label="미니창 업무 범위">${[['today','오늘'],['week','7일'],['flagged','중요']].map(([v,n])=>`<button data-action="widget-filter" data-value="${v}" class="${filter===v?'active':''}">${n}</button>`).join('')}</div>
 <form id="quickForm" class="quick-add">${ico('plus')}<input id="quickTitle" maxlength="200" placeholder="오늘 할 일을 추가하세요" aria-label="빠른 업무 추가" autocomplete="off"><button type="submit" class="iconbtn" aria-label="추가">${ico('arrow')}</button></form>`;
 const groups=new Map();
 for(const o of items.slice(0,ui.limit)){
  const name=o.effective&&o.effective<today?'기한이 지난 업무':o.effective===today?'오늘 처리할 업무':o.effective?shortDate(o.effective)+' ('+WD[dayOf(o.effective)]+')':'날짜 없는 업무';
  if(!groups.has(name))groups.set(name,[]);groups.get(name).push(o);
 }
 for(const [name,arr]of groups)html+=`<section class="task-section"><h3 class="group-header ${name==='기한이 지난 업무'?'overdue':''}"><span>${h(name)}<span class="group-count">${arr.length}</span></span></h3>${arr.map(taskCard).join('')}</section>`;
 if(!items.length)html+=`<div class="empty">${ico('checkall')}<strong>남은 업무가 없습니다.</strong>새 업무를 추가하거나 전체 화면을 확인하세요.</div>`;
 if(items.length>ui.limit)html+=`<button class="secondary" data-action="load-more">더 보기 (${ui.limit}/${items.length})</button>`;
 const events=data.events.filter(e=>e.date===today).sort((a,b)=>a.time.localeCompare(b.time));
 if(filter==='today'&&events.length)html+=`<section class="mini-events"><h3>오늘 회의 · 일정</h3>${events.map(e=>`<div class="agenda-event"><time class="event-time">${timeLabel(e.time)}</time><div class="event-info" data-action="select-event" data-id="${h(e.id)}" tabindex="0" role="button"><strong>${h(e.title)}</strong><small>${h(listOf(e.listId).name)}</small></div></div>`).join('')}</section>`;
 html+=`<p class="widget-notice">${data.demo?'예시 자료 · ':''}현재 브라우저에 저장됩니다. 기기 간 동기화는 미연결 상태입니다.<br>항상 위 고정: PowerToys 허용 환경에서 Win + Ctrl + T</p>`;
 return html;
}
async function installApp(){
 if(installPrompt){
  const prompt=installPrompt;installPrompt=null;
  try{await prompt.prompt();await prompt.userChoice}catch(_){toast('브라우저 메뉴에서 앱 설치를 선택해 주세요.')}
 }else{
  if(!$('#deviceGuide').open)deviceGuideOpen();
  toast(document.querySelector('meta[name="worknote-pwa"]')?'이미 설치했거나 설치 버튼이 제공되지 않습니다. 기기별 설치 안내를 확인해 주세요.':'이 HTML은 바로 실행용입니다. PWA 배포본을 HTTPS 주소로 올린 뒤 설치할 수 있습니다.');
 }
}
async function startPWA(){
 if(!document.querySelector('meta[name="worknote-pwa"]')||!['https:','http:'].includes(location.protocol))return;
 if(!('serviceWorker' in navigator)||!isSecureContext){offlineIssue='unsupported';return}
 try{
  await navigator.serviceWorker.register('./sw.js',{scope:'./'});
  await navigator.serviceWorker.ready;offlineReady=true;
 }catch(e){offlineIssue=String(e);console.warn('Offline shell registration failed',e)}
 if($('#installState'))$('#installState').textContent=installationState();
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
window.addEventListener('appinstalled',()=>{installPrompt=null;toast('앱이 설치되었습니다. 현재 자료는 이 기기에 저장됩니다.')});
window.addEventListener('hashchange',syncHash);
window.addEventListener('storage',e=>{
 if(e.key===PREF_KEY&&e.newValue){
  try{const p=JSON.parse(e.newValue);if(['system','light','dark'].includes(p.theme))prefs.theme=p.theme;if(['comfortable','large','xlarge'].includes(p.size))prefs.size=p.size;applyAppearance()}catch(_){}
 }
});
themeQuery.addEventListener('change',()=>{if(prefs.theme==='system')applyAppearance()});

let lastToday=todayKey();
setInterval(()=>{const t=todayKey();if(t!==lastToday){lastToday=t;poolCache=null;render()}},60000);
ui.widget=location.hash==='#mini';document.body.classList.toggle('widget-mode',ui.widget);
applyAppearance();render();if(!blockedStorage)save();startPWA();
if (fbAuth) {
  fbAuth.onAuthStateChanged(async (user) => {
    currentUser = user;
    renderSidebar();
    if (user) {
      lastSyncStr = '확인 중...';
      try {
        const docRef = fbDb.collection('users').doc(user.uid).collection('workboard').doc('main');
        const doc = await docRef.get();
        if (doc.exists) {
          const r = doc.data();
          if (r && r.payload) {
            const remoteData = validateData(JSON.parse(r.payload));
            const localIsEmpty = (!data.tasks.length && !data.events.length);
            if (localIsEmpty || !data.updatedAt || (remoteData.updatedAt && remoteData.updatedAt >= data.updatedAt)) {
              data = remoteData;
              save(false);
              render();
            } else if (data.updatedAt && remoteData.updatedAt && data.updatedAt > remoteData.updatedAt) {
              uploadToCloud();
            }
          }
        } else {
          uploadToCloud();
        }
        lastSyncStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        updateSyncStatus('동기화 완료 (' + lastSyncStr + ')');
        listenToCloudChanges(user.uid);
      } catch (err) {
        console.error('Initial sync error:', err);
      }
    } else {
      if (cloudUnsub) { cloudUnsub(); cloudUnsub = null; }
      renderSidebar();
    }
  });
}
